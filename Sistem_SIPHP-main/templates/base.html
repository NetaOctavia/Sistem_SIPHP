{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIPHP - Pemantauan Harga Pangan Subang{% endblock %}</title>
    
    <!-- Favicon / Logo Tab Browser -->
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet.js CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Style x-cloak agar modal disembunyikan saat halaman dimuat -->
    <style>
        [x-cloak] { display: none !important; }

        /* Utility class modular untuk form Django — tidak hardcode Tailwind di Python */
        .form-input {
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16,185,129,0.2);
        }
    </style>

    <!-- Alpine.js CDN (Wajib untuk Modal & Interaktivitas @click) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header Navbar (satu file: templates/includes/navbar.html) -->
    {% include 'includes/navbar.html' %}

    <!-- Content Block Dynamic -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full mb-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer (satu file: templates/includes/footer.html) -->
    {% include 'includes/footer.html' %}

    {% block scripts %}{% endblock %}

</body>
</html>
