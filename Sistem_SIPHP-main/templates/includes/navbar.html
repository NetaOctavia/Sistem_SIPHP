{% load static %}
<!-- NAVBAR GLOBAL — satu-satunya file navbar; edit di sini berlaku ke semua halaman -->
<nav class="bg-gradient-to-r from-teal-800 via-emerald-700 to-cyan-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-20">

        <!-- Logo & Brand -->
        <a href="{% url 'beranda' %}" class="flex items-center gap-3 group">
            <div class="w-14 h-14 bg-white rounded-2xl p-1.5 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="{% static 'image/logo_siphp.JPEG' %}" alt="Logo SIPHP Subang" class="w-full h-full object-contain rounded-xl">
            </div>
            <div class="flex flex-col">
                <span class="font-extrabold text-xl tracking-wide leading-none text-white">SIPHP</span>
                <span class="text-xs text-emerald-100 font-medium mt-0.5">Bidang Perdagangan — DKUPP Kab. Subang</span>
            </div>
        </a>

        <!-- Menu Utama Publik -->
        <div class="flex items-center space-x-3 md:space-x-6 text-xs md:text-sm font-medium">
            <a href="{% url 'beranda' %}" class="{% if request.resolver_match.url_name == 'beranda' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Beranda
            </a>
            <div class="relative group">
                <a href="{% url 'komoditas' %}" class="{% if request.resolver_match.url_name == 'komoditas' or request.resolver_match.url_name == 'komoditas_ekspor' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition flex items-center gap-1">
                    Komoditas
                    <svg class="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </a>
                <!-- Dropdown Menu Komoditas -->
                <div class="absolute left-0 top-full pt-2 hidden group-hover:block focus-within:block z-50">
                    <div class="w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-2 overflow-hidden">
                        <a href="{% url 'komoditas' %}" class="block px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 transition">
                            📈 Harga Komoditas
                        </a>
                        <a href="{% url 'komoditas_ekspor' %}" class="block px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 transition">
                            🚢 Komoditi Ekspor
                        </a>
                    </div>
                </div>
            </div>
            <a href="{% url 'berita' %}" class="{% if request.resolver_match.url_name == 'berita' or request.resolver_match.url_name == 'berita_detail' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Berita
            </a>
            <a href="{% url 'layanan_teknis' %}" class="{% if request.resolver_match.url_name == 'layanan_teknis' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Layanan Teknis
            </a>
            <a href="{% url 'profil' %}" class="{% if request.resolver_match.url_name == 'profil' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Profil
            </a>
            <a href="{% url 'kontak' %}" class="{% if request.resolver_match.url_name == 'kontak' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Kontak
            </a>
        </div>

        <!-- Tombol Dashboard / Logout (hanya jika sudah login) -->
        <div>
            {% if user.is_authenticated %}
                <div class="flex items-center gap-2">
                    <a href="{% url 'dashboard_index' %}" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-md flex items-center gap-1.5">
                        📊 Dashboard Admin
                    </a>
                    <a href="{% url 'logout' %}" class="bg-rose-600/90 hover:bg-rose-700 text-white text-xs px-3 py-2 rounded-xl font-semibold transition">
                        Logout
                    </a>
                </div>
            {% else %}
                {% block auth_button %}{% endblock %}
            {% endif %}
        </div>

    </div>
</nav>
