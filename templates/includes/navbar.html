{% load static %}
<!-- NAVBAR GLOBAL — satu-satunya file navbar; edit di sini berlaku ke semua halaman -->
<nav class="bg-gradient-to-r from-teal-800 via-emerald-700 to-cyan-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-20">

        <!-- Logo & Brand -->
        <a href="{% url 'beranda' %}" class="flex items-center gap-3 group">
            <div class="w-12 h-12 md:w-14 md:h-14 rounded-full overflow-hidden shadow-sm border-[2px] border-white group-hover:scale-105 transition-transform duration-200 bg-white shrink-0">
                <img src="{% static 'image/logo_siphp_baru.jpg' %}" alt="Logo SIPHP Subang" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col">
                <span class="font-extrabold text-xl tracking-wide leading-none text-white">SIPHP</span>
                <span class="text-xs text-emerald-100 font-medium mt-0.5">Bidang Perdagangan — DKUPP Kab. Subang</span>
            </div>
        </a>

        <!-- Menu Utama Publik -->
        <div class="flex items-center space-x-3 md:space-x-6 text-xs md:text-sm font-medium">
            <a href="{% url 'beranda' %}" class="{% if request.resolver_match.url_name == 'beranda' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Beranda
            </a>
            <div class="relative group">
                <a href="{% url 'komoditas' %}" class="{% if request.resolver_match.url_name == 'komoditas' or request.resolver_match.url_name == 'komoditas_ekspor' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition flex items-center gap-1">
                    Komoditi
                    <svg class="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </a>
                <!-- Dropdown Menu Komoditas -->
                <div class="absolute left-0 top-full pt-2 hidden group-hover:block focus-within:block z-50">
                    <div class="w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-2 overflow-hidden">
                        <a href="{% url 'komoditas' %}" class="block px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
                            </svg>
                            Harga Komoditi
                        </a>
                        <a href="{% url 'komoditas_ekspor' %}" class="block px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" viewBox="0 0 640 512" fill="currentColor"><path d="M73.4 83.1c-14.7-6.2-31.4-1.7-41.5 10.7C19.9 108.5 24 133.4 42.4 141l92.5 38.3L153 150l-29.3-8.8c-12-3.6-18.8-16.3-15.2-28.2s16.3-18.8 28.2-15.2L174.1 109l62.3-51.9c13.7-11.4 33.7-11.1 47 1l125.7 94.3 64-16c14.2-3.5 29 1 39 12l29 31.9c9.5 10.4 12.6 25 8.2 38.4l-11.7 35.1 43.1 17.8c18.5 7.6 22.5 32.5 10.5 47.1l-14.8 18c-7.3 8.9-18 13.9-29.6 13.9H512c-5.7 0-11.2-1.7-15.8-4.9l-72-50.4c-9-6.3-20.7-6.9-30.2-1.5L343.4 274.6c-13.8 7.8-30.8 8.4-45.1 1.7L181.7 221.7c-9.7-4.5-20.9-4.8-30.8-.9L37.7 263.2c-15.6 6.1-25.7 21.1-25.7 37.9V336c0 14.7 10.1 27.2 24.3 30.6l21.2 5.3 0 16.1c0 26.5 21.5 48 48 48H128c11 0 21.1-3.7 29.2-9.9l46.2 37c15.2 12.1 34.6 18.9 54.6 18.9s39.4-6.8 54.6-18.9l46.2-37c8.1 6.2 18.2 9.9 29.2 9.9h22.5c26.5 0 48-21.5 48-48V372l22.2-5.5c14.5-3.6 24.8-16.4 24.8-31.5V308.2c0-5-1.5-9.9-4.3-14.2l-21.2-32.9L362 135c-4.4-3.3-11-3.4-15.6-.4l-52.5 34.3c-4.4 2.9-9.8 4.1-15.1 3.5l-63.5-7.1L128.5 91.8c-15.5-12.9-38.3-13.6-55.1-8.7z"/></svg>
                            Komoditi Ekspor
                        </a>
                    </div>
                </div>
            </div>
            <a href="{% url 'berita' %}" class="{% if request.resolver_match.url_name == 'berita' or request.resolver_match.url_name == 'berita_detail' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Berita
            </a>
            <a href="{% url 'layanan_teknis' %}" class="{% if request.resolver_match.url_name == 'layanan_teknis' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Layanan Teknis
            </a>
            <a href="{% url 'profil' %}" class="{% if request.resolver_match.url_name == 'profil' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Profil
            </a>
            <a href="{% url 'kontak' %}" class="{% if request.resolver_match.url_name == 'kontak' %}text-white border-b-2 border-white font-bold{% else %}text-emerald-100 hover:text-white{% endif %} pb-0.5 transition">
                Kontak
            </a>
        </div>

        <!-- Tombol Dashboard / Logout (hanya jika sudah login) -->
        <div>
            {% if user.is_authenticated %}
                <div class="flex items-center gap-2">
                    <a href="{% url 'dashboard_index' %}" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-md flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                        </svg>
                        Dashboard Admin
                    </a>
                    <a href="{% url 'logout' %}" class="bg-rose-600/90 hover:bg-rose-700 text-white text-xs px-3 py-2 rounded-xl font-semibold transition">
                        Logout
                    </a>
                </div>
            {% else %}
                {% block auth_button %}{% endblock %}
            {% endif %}
        </div>

    </div>
</nav>
